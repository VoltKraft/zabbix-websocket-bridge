services:
  zabbix-websocket-bridge:
    image: ghcr.io/voltkraft/zabbix-websocket-bridge:latest
    pull_policy: always
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      LOG_LEVEL: info
      BRIDGE_MAX_CONCURRENT_BATCHES: 8
    expose:
      - "8080"
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    restart: unless-stopped
